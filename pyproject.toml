[project]
name = "discord-tui-acc-manager"
version = "0.1.0"
description = "TUI to manage multiple Discord accounts by token: bio, status, presence, avatar, banner, name"
requires-python = ">=3.10"
dependencies = [
    "textual>=0.60",
    "httpx>=0.27",
    "cryptography>=42.0",
    "pillow>=10.0",
    "websockets>=12.0",
]

[project.scripts]
discord-tui = "main:run"
discord-daemon = "daemon:run"

[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["main", "daemon"]
packages = ["src", "src.tui"]
